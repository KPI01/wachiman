services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    container_name: control-accesos-app
    build:
      context: .
    image: localhost/control-accesos-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:${PORT:-3000}"
    volumes:
      - "${UPLOADS_BASE_PATH}:${UPLOADS_BASE_PATH}"
    networks:
      - internal
    command: ["sh", "-c", "pnpm db:migrate:runtime && pnpm db:seed && exec pnpm start"]
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: {}

networks:
  internal:
    internal: true
