services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
    image: wachiman-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UPLOADS_BASE_PATH: /uploads
      BRANDING_BASE_PATH: /app/public/branding
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - uploads_data:/uploads
      - ./branding:/app/public/branding
    networks:
      - internal
    command: ["sh", "-c", "pnpm db:migrate:runtime && pnpm db:seed && exec pnpm start"]
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: {}
  uploads_data: {}

networks:
  internal:
    internal: true
